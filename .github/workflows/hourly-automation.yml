name: Hourly automation

# Calls the site's hourly automation route. Needs one repository secret, CRON_SECRET, with the same
# value as the CRON_SECRET environment variable on the hosting platform. Until it is set, this
# workflow does nothing (it does not fail); the once-a-day run on the hosting platform keeps working.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip when CRON_SECRET is not set
        if: env.CRON_SECRET == ''
        run: echo "CRON_SECRET repository secret is not set; skipping."
      - name: Run the hourly automation
        if: env.CRON_SECRET != ''
        run: |
          curl --fail-with-body --silent --show-error --max-time 100 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://jdlcore.com/api/cron/hourly
